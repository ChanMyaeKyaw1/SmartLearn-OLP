{% extends 'base.html' %} {% block title %}Live Room - {{ classroom.title }}{% endblock %} {% block content %}
<div class="main-container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center gap-2">
            <a href="{% url 'classroom_detail' classroom.class_id %}" class="btn btn-outline-secondary card-action-btn-small text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i> Back
            </a>
            <h3 class="m-0 fw-bold" style="color: #2b4c3f;">Live Class: {{ classroom.title }}</h3>
        </div>

        {% if request.user == classroom.owner %}
        <a href="{% url 'toggle_live_status' classroom.class_id %}" class="btn btn-outline-danger card-action-btn-small text-decoration-none" onclick="return confirm('End live session for all students?');">
            <i class="fa-solid fa-power-off me-1"></i> End Stream
        </a>
        {% endif %}
    </div>

    <!-- Container where Jitsi iframe injects -->
    <div id="jitsi-container" class="rounded-4 overflow-hidden shadow-sm border" style="width: 100%; height: 680px; background-color: #000;"></div>
</div>

<!-- Jitsi External API Script -->
<script src="https://meet.jit.si/external_api.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // live_room.html

        const domain = "meet.jit.si";
        const options = {
            roomName: "{{ room_name }}",
            width: "100%",
            height: 680,
            parentNode: document.querySelector('#jitsi-container'),
            userInfo: {
                displayName: "{{ request.user.username }}"
            },
            configOverwrite: {
                startWithAudioMuted: true,
                disableDeepLinking: true,
                // Disable lobby mode & moderator requirements
                enableLobbyChat: false,
                autoKnockWaitingForApproval: false,
                // Bypass the requirement for an authenticated moderator to start the room
                prejoinPageEnabled: false,
                requireDisplayName: false
            },
            interfaceConfigOverwrite: {
                SHOW_JITSI_WATERMARK: false,
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'desktop', 'fullscreen',
                    'fittoscreen', 'chat', 'raisehand', 'tileview', 'hangup'
                ]
            }
        };

        const api = new JitsiMeetExternalAPI(domain, options);
        // Redirect back to classroom when user hangs up
        api.addEventListener('videoConferenceLeft', () => {
            window.location.href = "{% url 'classroom_detail' classroom.class_id %}";
        });
    });
</script>
{% endblock %}
