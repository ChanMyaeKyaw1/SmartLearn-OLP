{% extends 'custom_admin/admin_base.html' %} {% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-bold py-3">
            <i class="fa-solid fa-user-gear me-2 text-primary"></i>Edit User: {{ target_user.username }}
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ target_user.username }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ target_user.email }}">
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" name="is_staff" id="is_staff" {% if target_user.is_staff %}checked{% endif %}>
                    <label class="form-check-label fw-semibold" for="is_staff">Teacher / Staff Permissions</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if target_user.is_active %}checked{% endif %}>
                    <label class="form-check-label fw-semibold" for="is_active">Account Active</label>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'custom_admin_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
